# Applies Drizzle migrations in lib/db/drizzle/ to your Supabase Postgres database.
#
# Setup (one time in GitHub):
# 1. Repo → Settings → Secrets and variables → Actions → New repository secret
# 2. Name: DATABASE_URL
# 3. Value: your Supabase database URL (Project Settings → Database → URI).
#    Prefer the "direct" connection (port 5432) for migrations if the pooler fails.
#
# This does NOT run the seed script; it only runs migrations (schema).
name: Supabase — apply DB migrations

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @workspace/db run migrate
